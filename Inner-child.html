<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inner Child</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}
body {
    background: linear-gradient(to bottom, #B3E5FC, #0D47A1);
    color: #0D47A1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px;
}
nav a { margin-top: 20px; display: inline-block; }
h1 { font-size: 40px; margin: 20px 0; }
.affirmation {
    background: #FFD966;
    padding: 15px;
    border-radius: 12px;
    margin: 10px 0;
    font-size: 28px; 
    text-align: center;
}
h2 { font-size: 28px; margin: 10px 0; }
button {
    padding: 14px 30px;
    font-size: 28px; 
    margin: 15px 0;
    border: none;
    border-radius: 8px;
    background-color: #FFD966;
    color: #0D47A1;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s, background-color 0.2s;
}
button:hover { transform: scale(1.05); background-color: #FFE58A; }
.reward {
    display: none;
    margin-top: 20px;
    font-size: 28px; 
    color: #0D47A1;
    animation: pop 0.8s ease-out;
}
@keyframes pop {
  0% { transform: scale(0); }
  70% { transform: scale(1.2); }
  100% { transform: scale(1); }
}
#camera { border-radius: 12px; margin-top: 10px; width: 300px; height: 200px; }
ul#tasks {
    list-style: none;
    padding-left: 0;
    margin-top: 20px;
    text-align: left;
}
ul#tasks li {
    font-size: 28px;
    margin: 10px 0;
}
@media (max-width: 600px) {
    h1 { font-size: 28px; }
    h2, .affirmation, button, .reward, ul#tasks li { font-size: 20px; }
    #camera { width: 90%; height: auto; }
}
</style>
</head>
<body>
<nav>
  <a href="index.html"><button>Tilbage til Forside</button></a>
</nav>

<h1>Inner Child Session</h1>
<div class="affirmation" id="affirmation"></div>

<h2>Tag et billede for at starte</h2>
<video id="camera" autoplay playsinline></video>
<button id="switchCamera">Skift Kamera</button>
<button id="takePhoto">Tag billede</button>
<button id="openGallery">Se dit galleri</button>
<canvas id="snapshot" width="300" height="200" style="display:none;"></canvas>

<ul id="tasks"></ul>

<div class="reward" id="reward">🎉 Dit indre barn er stolt! ⭐</div>

<script>
// --- Dummy affirmation ---
const affirmations = [
  "Leg og udforsk verden med glæde.",
  "Dit indre barn elsker små eventyr.",
  "Du er tryg og kreativ."
];
document.getElementById('affirmation').innerText =
  affirmations[Math.floor(Math.random()*affirmations.length)];

// --- Opgaver ---
const taskPool = [
  "Gå en lille tur udenfor",
  "Find noget naturligt (blad, sten, blomst)",
  "Tegn et lille billede af noget, du elsker",
  "Lav en lille dans i stuen",
  "Sig noget venligt til dig selv højt"
];
function getRandomTasks() {
    let shuffled = taskPool.sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 3);
}

// --- Kamera setup ---
let video = document.getElementById('camera');
let useFrontCamera = true;

async function startCamera() {
  if(window.stream) window.stream.getTracks().forEach(track => track.stop());
  try {
    const constraints = { video: { facingMode: useFrontCamera ? "user" : { exact: "environment" } } };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    window.stream = stream;
    video.srcObject = stream;
  } catch(err) {
    console.error("Kamera fejl:", err);
    alert("Kamera kunne ikke startes. Prøv at give adgang eller skift browser.");
  }
}

// Skift kamera
document.getElementById('switchCamera').addEventListener('click', ()=>{
  useFrontCamera = !useFrontCamera;
  startCamera();
});

// Tag billede
document.getElementById('takePhoto').addEventListener('click', ()=>{
  const canvas = document.getElementById('snapshot');
  const context = canvas.getContext('2d');
  context.drawImage(video,0,0,canvas.width,canvas.height);
  const imageData = canvas.toDataURL('image/png');

  const gallery = JSON.parse(localStorage.getItem('innerChildGallery') || "[]");
  gallery.push({ date: new Date().toISOString(), image: imageData });
  localStorage.setItem('innerChildGallery', JSON.stringify(gallery));

  // Belønning
  const reward = document.getElementById('reward');
  reward.style.display = 'block';
  setTimeout(()=>{ reward.style.display='none'; },3000);

  // Vis opgaver
  const tasks = getRandomTasks();
  const ul = document.getElementById('tasks');
  ul.innerHTML = "";
  tasks.forEach(t=>{
    const li = document.createElement('li');
    li.textContent = "⭐ " + t;
    ul.appendChild(li);
  });
});

// Galleri-knap
document.getElementById('openGallery').addEventListener('click', ()=>{
  window.location.href = "inner-child-gallery.html";
});

startCamera();
</script>
</body>
</html>
