<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inner Child App</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #fff3e6;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1, h2 { color: #ff6600; }
    .affirmation {
      background: #ffd699;
      padding: 15px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 1.2em;
      text-align: center;
    }
    .tasks {
      margin: 10px 0;
      width: 100%;
      max-width: 400px;
    }
    .task {
      background: #ffe6cc;
      padding: 10px;
      margin: 5px 0;
      border-radius: 8px;
    }
    button {
      background: #ff9933;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #ff6600; }
    .reward {
      display: none;
      margin-top: 20px;
      font-size: 1.5em;
      color: #ff3300;
      animation: pop 0.8s ease-out;
      text-align: center;
    }
    @keyframes pop {
      0% { transform: scale(0); }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    #camera { border-radius: 10px; margin-top: 10px; }
    #photoResult { margin-top: 10px; border-radius: 10px; max-width: 300px; }
    .gallery-item { margin: 5px 0; background: #fff0e6; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Inner Child Session</h1>

  <div class="affirmation" id="affirmation"></div>

  <div class="tasks" id="tasks"></div>
  <button id="completeBtn">Jeg har fuldført dagens opgaver</button>

  <div class="reward" id="reward">🎉 Dit indre barn er stolt! ⭐</div>

  <h2>Tilføj nyt billede til galleri</h2>
  <video id="camera" autoplay playsinline width="300"></video>
  <button id="takePhoto">Tag billede</button>
  <canvas id="snapshot" width="300" height="200" style="display:none;"></canvas>
  <img id="photoResult" src="" alt="Dit billede vises her">

  <h2>Dit Indre Barn Galleri</h2>
  <div id="galleryDisplay"></div>

  <script>
    // --- Dummy ChatGPT-affirmationer ---
    const affirmationsMorning = [
      "Jeg leger og udforsker verden med glæde.",
      "Jeg er tryg og åben for nye oplevelser.",
      "Mit indre barn elsker at opdage små skatte."
    ];
    const affirmationsEvening = [
      "Jeg trøster og passer på mit indre barn.",
      "Jeg reflekterer over dagens glæder.",
      "Jeg mærker ro og taknemmelighed inden natten."
    ];

    // --- Dummy galleridata ---
    if(!localStorage.getItem('gallery')) {
      localStorage.setItem('gallery', JSON.stringify([
        {name: "blad", color: "grøn", location: "park", date: "2025-10-09"},
        {name: "kastanje", color: "brun", location: "skov", date: "2025-10-09"},
        {name: "sten", color: "grå", location: "strand", date: "2025-10-09"}
      ]));
    }

    function loadGallery() {
      return JSON.parse(localStorage.getItem('gallery') || "[]");
    }

    function displayGallery() {
      const galleryDiv = document.getElementById('galleryDisplay');
      galleryDiv.innerHTML = '';
      const gallery = loadGallery();
      gallery.forEach(item => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        div.innerHTML = `<strong>${item.name}</strong> (${item.color}) - ${item.location} <br><img src="${item.image || ''}" style="max-width:100px; display:block;">`;
        galleryDiv.appendChild(div);
      });
    }

    // --- Daglig session-lås ---
    const today = new Date().toISOString().split('T')[0];
    if(localStorage.getItem('sessionDate') === today) {
      document.getElementById('affirmation').innerText = "Du har allerede gennemført dagens session. Kom tilbage i morgen!";
      document.getElementById('tasks').style.display = 'none';
      document.getElementById('completeBtn').style.display = 'none';
    } else {
      const hour = new Date().getHours();
      const timeOfDay = hour < 12 ? "morning" : "evening";
      const affirmation = timeOfDay === "morning" ? 
                          affirmationsMorning[Math.floor(Math.random()*affirmationsMorning.length)] :
                          affirmationsEvening[Math.floor(Math.random()*affirmationsEvening.length)];
      document.getElementById('affirmation').innerText = affirmation;

      const gallery = loadGallery();
      const tasksDiv = document.getElementById('tasks');
      const shuffled = gallery.sort(() => 0.5 - Math.random()).slice(0,3);
      shuffled.forEach((item,index)=>{
        const div = document.createElement('div');
        div.className = 'task';
        div.innerText = `Opgave ${index+1}: Brug ${item.name} (${item.color}) fra ${item.location} som inspiration til en kreativ aktivitet.`;
        tasksDiv.appendChild(div);
      });
    }

    // --- Fuldfør opgaver ---
    document.getElementById('completeBtn').addEventListener('click', () => {
      document.getElementById('reward').style.display = 'block';
      localStorage.setItem('sessionDate', today);
      document.getElementById('completeBtn').disabled = true;
      document.getElementById('tasks').style.opacity = 0.5;
    });

    // --- Kamera og billede ---
    const video = document.getElementById('camera');
    const canvas = document.getElementById('snapshot');
    const photoResult = document.getElementById('photoResult');
    const takePhotoBtn = document.getElementById('takePhoto');

    navigator.mediaDevices.getUserMedia({video:true})
      .then(stream => { video.srcObject = stream; })
      .catch(err => console.error("Kamera fejl:", err));

    takePhotoBtn.addEventListener('click', () => {
      const context = canvas.getContext('2d');
      context.drawImage(video,0,0,canvas.width,canvas.height);
      const imageData = canvas.toDataURL('image/png');
      photoResult.src = imageData;

      const gallery = loadGallery();
      gallery.push({
        name: prompt("Navn på objekt:"),
        color: prompt("Farve på objekt:"),
        location: prompt("Sted hvor det blev fundet:"),
        date: new Date().toISOString(),
        image: imageData
      });
      localStorage.setItem('gallery', JSON.stringify(gallery));
      displayGallery();
      alert("Billedet er gemt i dit galleri!");
    });

    displayGallery();
  </script>
</body>
</html>
